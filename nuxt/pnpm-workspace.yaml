# pnpm >=11 no longer reads the "pnpm" field of package.json, so every setting
# lives here — keep it the single source of truth or the two majors resolve
# different trees and fight over the lockfile.
overrides:
  devalue@5.8.0: 5.8.1
  vite: ^7.0.0
  esbuild: ^0.25.0
  tar: ^7.5.11
  brace-expansion: ^5.0.8

# A dependency that ships a build script must be classified explicitly:
# `strictDepBuilds` defaults to true in pnpm 11 and aborts the install
# (ERR_PNPM_IGNORED_BUILDS). `allowBuilds` is the only spelling both majors
# honour from this file.
allowBuilds:
  # reached through vite, which loads the platform binary from the @esbuild/*
  # optional packages directly
  esbuild: false
  # node-gyp-build resolves the @parcel/watcher-* prebuild at require time; the
  # install script would only compile from source when no prebuild matches, and
  # the deploy host has no toolchain to do that with
  "@parcel/watcher": false

# pnpm 11 refuses to install a lockfile entry published less than 24h ago
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — a quarantine against compromised
# releases that get yanked within hours. Declaring the same window here makes
# pnpm 10 enforce it at *resolution* time, so a lockfile written locally or by
# a dependency bump can never be one the deploy host will reject.
minimumReleaseAge: 1440
