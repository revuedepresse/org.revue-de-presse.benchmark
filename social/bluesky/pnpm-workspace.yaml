# pnpm >=11 no longer reads the "pnpm" field of package.json, so every setting
# lives here — keep it the single source of truth or the two majors resolve
# different trees and fight over the lockfile.
overrides:
  vite: ^7.3.6
  esbuild: ^0.25.0
  # @atproto-labs/fetch-node pulls three undici majors side by side through
  # npm aliases, so a plain `undici` key never matches them: the override has
  # to name each alias. Each floor is the first release carrying the
  # Dependabot-reported fixes.
  "@atproto-labs/fetch-node>undici_v6": npm:undici@^6.28.1
  "@atproto-labs/fetch-node>undici_v7": npm:undici@^7.29.1
  "@atproto-labs/fetch-node>undici_v8": npm:undici@^8.10.2

# A dependency that ships a build script must be classified explicitly: pnpm
# only warns about unclassified ones under 10.x, but `strictDepBuilds` defaults
# to true in 11.x and aborts the install (ERR_PNPM_IGNORED_BUILDS). Use
# `allowBuilds` rather than onlyBuiltDependencies/ignoredBuiltDependencies —
# it is the only spelling both majors honour from this file.
allowBuilds:
  esbuild: false
  # prebuilt libvips binaries come from @img/sharp-* — nothing to compile
  sharp: false
  # transitive via @atproto/oauth-client-node; its postinstall only prints a
  # funding banner
  core-js: false

# pnpm 11 refuses to install a lockfile entry published less than 24h ago
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — a quarantine against compromised
# releases that get yanked within hours. This restates pnpm 11's own default,
# so the window stays visible next to the overrides and survives anyone
# lowering the packageManager pin. Consequence worth knowing: a dependency bump
# is not installable anywhere until its newest entry is a day old.
minimumReleaseAge: 1440

# nanoid@3.3.18 arrived with the dependabot batch on main while still inside
# the 24h quarantine above. The release is a patch on the 3.x line, it is what
# the bumped tree resolves to, and pnpm's own approval flow records exemptions
# in exactly this name@version form — so it is pinned here rather than dodged
# by regenerating the lockfile, which would drag ~70 lines of unrelated
# transitives forward. Scoped to the one version: it goes inert the moment
# nanoid moves on, and can be deleted outright any time after 2026-08-08T16:35Z.
minimumReleaseAgeExclude:
  - nanoid@3.3.18
