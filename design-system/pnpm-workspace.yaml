packages:
  - "apps/*"
  - "output/*"
  - "packages/*"

# pnpm >=11 no longer reads the "pnpm" field of package.json, so every setting
# lives here — keep it the single source of truth or the two majors resolve
# different trees and fight over the lockfile.
overrides:
  vite: ^8.0.16
  esbuild: ^0.25.0
  svelte: ^5.55.9
  "@tootallnate/once": ^3.0.1
  "@builder.io/mitosis>@angular/compiler": ^20.0.0
  linkify-it: ^5.0.2
  markdown-it: ^14.2.0
  "@babel/core": ^7.29.6
  brace-expansion: ^5.0.8
  # brace-expansion 5 is ESM-only with named exports; minimatch@3 is CJS and
  # calls the module as a function, so the blanket override above turned every
  # `mitosis build` into "TypeError: expand is not a function" before it read a
  # single source file. 1.1.12+ carries the ReDoS fix the override was for.
  "minimatch@3>brace-expansion": ^1.1.12

# pnpm 11 refuses to install a lockfile entry published less than 24h ago
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — a quarantine against compromised
# releases that get yanked within hours. This restates pnpm 11's own default,
# so the window stays visible next to the overrides and survives anyone
# lowering the packageManager pin. Consequence worth knowing: a dependency bump
# is not installable anywhere until its newest entry is a day old.
minimumReleaseAge: 1440

# Migrated from .npmrc, which pnpm 11 no longer consults for pnpm settings.
# Both match the current defaults, but the lockfile records autoInstallPeers,
# so state them rather than depend on a default staying put. Hoisting is
# deliberately left strict here — unlike nuxt, nothing reaches for an
# undeclared dependency.
autoInstallPeers: true
strictPeerDependencies: false

# A dependency that ships a build script must be classified explicitly:
# `strictDepBuilds` defaults to true in pnpm 11 and aborts the install
# (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  # reached through vite, which loads the platform binary from the @esbuild/*
  # optional packages directly
  esbuild: false
  # its postinstall is a bare `echo` reminding you to install whichever
  # preprocessor packages you actually use
  svelte-preprocess: false
