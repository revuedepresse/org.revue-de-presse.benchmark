<div
  data-testid="app-shell"
  x-data="app()"
  x-bind:class="`rdp-app rdp-app--${layout ?? 'desktop'}`"
>
  <div class="rdp-app__header-ribbon">
    <div class="rdp-app__header-inner">
      <AppHeader
        x-bind:layout="layout ?? 'desktop'"
        x-bind:authenticated="false"
        x-on:logo-click="goHome()"
      ></AppHeader>
    </div>
  </div>
  <template x-if="showPopularNews === true && mainSubView !== 'summary'">
    <p class="rdp-app__popular-news"><span x-html="popularNewsLine"></span></p>
  </template>
  <template x-if="(layout ?? 'desktop') === 'desktop'">
    <div class="rdp-app__content">
      <template x-if="!captureMode">
        <aside class="rdp-app__column">
          <Sidebar
            x-bind:lists="lists"
            x-bind:selectedListId="selectedListId"
            x-bind:selectedDate="pickedDate"
            x-bind:yearRange="yearRange"
            x-bind:minDate="minDate"
            x-bind:locale="locale"
            x-on:list-select="onListSelect?.(id)"
            x-on:date-select="selectFromSidebar(d)"
            x-on:legal-notice-click="goTo('legal')"
            x-on:terms-of-service-click="goTo('terms')"
            x-on:contact-click="goTo('contact')"
            x-on:support-click="goTo('support')"
            x-on:sources-click="goTo('sources')"
          ></Sidebar>
        </aside>
      </template>
      <main
        class="rdp-app__main"
        x-bind:aria-busy="loading ? 'true' : undefined"
      >
        <template x-if="currentView !== 'main'">
          <button type="button" class="rdp-app__back" x-on:click="goTo('main')">
            ← Retour aux publications
          </button>
        </template>
        <template x-if="!captureMode && currentView === 'main'">
          <IntroCard></IntroCard>
        </template>
        <template x-if="currentView === 'main' && loading === true">
          <Spinner></Spinner>
        </template>
        <template
          x-if="currentView === 'main' && !loading && posts.length === 0"
        >
          <Alert
            variant="empty"
            x-bind:messageKey="emptyMessageKey ?? 'alert.empty.no-content-for-date'"
          ></Alert>
        </template>
        <template x-if="currentView === 'main' && !loading && posts.length > 0">
          <div
            class="rdp-app__main-toggle"
            role="tablist"
            x-bind:aria-label="t('day.toggle.ariaLabel')"
          >
            <button
              type="button"
              role="tab"
              x-bind:aria-selected="(mainSubView ?? 'publications') === 'publications'"
              x-bind:class="(mainSubView ?? 'publications') === 'publications' ? 'rdp-app__main-toggle-btn rdp-app__main-toggle-btn--active' : 'rdp-app__main-toggle-btn'"
              x-on:click="onMainSubViewChange?.('publications')"
            >
              <span x-html="t('day.toggle.publications')"></span>
            </button>
            <button
              type="button"
              role="tab"
              x-bind:aria-selected="mainSubView === 'summary'"
              x-bind:class="mainSubView === 'summary' ? 'rdp-app__main-toggle-btn rdp-app__main-toggle-btn--active' : 'rdp-app__main-toggle-btn'"
              x-on:click="onMainSubViewChange?.('summary')"
            >
              <span x-html="t('day.toggle.summary')"></span>
            </button>
          </div>
          <template x-if="(mainSubView ?? 'publications') === 'publications'">
            <ol class="rdp-app__post-list">
              <template x-for="post in posts">
                <li class="rdp-app__post-item">
                  <BlueskyPostCard
                    x-bind:post="post"
                    x-bind:locale="locale"
                  ></BlueskyPostCard>
                </li>
              </template>
            </ol>
          </template>
          <template x-if="mainSubView === 'summary'">
            <h1 class="rdp-app__synthesis-title">
              <span x-html="synthesisHeadline"></span>
            </h1>
            <template x-if="!!summaryLoading">
              <Spinner></Spinner>
            </template>
            <template
              x-if="!summaryLoading && (summaryBlocks ?? []).length === 0"
            >
              <Alert variant="empty" messageKey="day.summary.empty"></Alert>
            </template>
            <template
              x-if="!summaryLoading && (summaryBlocks ?? []).length > 0"
            >
              <article class="rdp-app__summary">
                <template x-for="block in summaryBlocks ?? []">
                  <div>
                    <template x-if="block.kind === 'paragraph'">
                      <p class="rdp-app__summary-p">
                        <template x-for="seg in block.segments">
                          <div>
                            <template x-if="seg.kind === 'text'">
                              <span x-html="seg.value"></span>
                            </template>
                            <template x-if="seg.kind === 'bold'">
                              <strong><span x-html="seg.value"></span></strong>
                            </template>
                            <template x-if="seg.kind === 'handle'">
                              <a
                                class="rdp-app__summary-handle"
                                target="_blank"
                                rel="noreferrer noopener"
                                x-bind:href="`https://bsky.app/profile/${seg.value}`"
                              >
                                @
                                <span x-html="seg.value"></span>
                              </a>
                            </template>
                          </div>
                        </template>
                      </p>
                    </template>
                    <template x-if="block.kind === 'bullets'">
                      <ul class="rdp-app__summary-ul">
                        <template x-for="item in block.items">
                          <li>
                            <template x-for="seg in item">
                              <div>
                                <template x-if="seg.kind === 'text'">
                                  <span x-html="seg.value"></span>
                                </template>
                                <template x-if="seg.kind === 'bold'">
                                  <strong>
                                    <span x-html="seg.value"></span>
                                  </strong>
                                </template>
                                <template x-if="seg.kind === 'handle'">
                                  <a
                                    class="rdp-app__summary-handle"
                                    target="_blank"
                                    rel="noreferrer noopener"
                                    x-bind:href="`https://bsky.app/profile/${seg.value}`"
                                  >
                                    <span x-html="seg.value"></span>
                                  </a>
                                </template>
                              </div>
                            </template>
                          </li>
                        </template>
                      </ul>
                    </template>
                  </div>
                </template>
              </article>
            </template>
          </template>
        </template>
        <template x-if="currentView === 'legal'">
          <LegalNoticePage></LegalNoticePage>
        </template>
        <template x-if="currentView === 'terms'">
          <TermsOfServicePage></TermsOfServicePage>
        </template>
        <template x-if="currentView === 'contact'">
          <ContactPage></ContactPage>
        </template>
        <template x-if="currentView === 'support'">
          <SupportPage></SupportPage>
        </template>
        <template x-if="currentView === 'sources'">
          <SourcesPage></SourcesPage>
        </template>
      </main>
    </div>
  </template>
  <template x-if="(layout ?? 'desktop') === 'mobile'">
    <main
      class="rdp-app__mobile-main"
      x-bind:aria-busy="loading ? 'true' : undefined"
    >
      <template x-if="currentView !== 'main'">
        <button type="button" class="rdp-app__back" x-on:click="goTo('main')">
          ← Retour aux publications
        </button>
      </template>
      <template x-if="!captureMode && currentView === 'main'">
        <IntroCard></IntroCard>
      </template>
      <template x-if="currentView === 'main' && loading === true">
        <Spinner></Spinner>
      </template>
      <template x-if="currentView === 'main' && !loading && posts.length === 0">
        <Alert
          variant="empty"
          x-bind:messageKey="emptyMessageKey ?? 'alert.empty.no-content-for-date'"
        ></Alert>
      </template>
      <template x-if="currentView === 'main' && !loading && posts.length > 0">
        <ol class="rdp-app__post-list">
          <template x-for="post in posts">
            <li class="rdp-app__post-item">
              <BlueskyPostCard
                x-bind:post="post"
                x-bind:locale="locale"
              ></BlueskyPostCard>
            </li>
          </template>
        </ol>
      </template>
      <template x-if="currentView === 'legal'">
        <LegalNoticePage></LegalNoticePage>
      </template>
      <template x-if="currentView === 'terms'">
        <TermsOfServicePage></TermsOfServicePage>
      </template>
      <template x-if="currentView === 'contact'">
        <ContactPage></ContactPage>
      </template>
      <template x-if="currentView === 'support'">
        <SupportPage></SupportPage>
      </template>
      <template x-if="currentView === 'sources'">
        <SourcesPage></SourcesPage>
      </template>
      <template x-if="!captureMode">
        <BannerAbout
          x-on:legal-notice-click="goTo('legal')"
          x-on:terms-of-service-click="goTo('terms')"
          x-on:contact-click="goTo('contact')"
          x-on:support-click="goTo('support')"
          x-on:sources-click="goTo('sources')"
        ></BannerAbout>
      </template>
    </main>
    <template x-if="isCalendarOpen">
      <Calendar
        presentation="sheet"
        x-bind:selectedDate="focusedDate"
        x-bind:locale="locale"
        x-bind:yearRange="yearRange"
        x-bind:minDate="minDate"
        x-on:select="pickFromCalendar(d)"
        x-on:dismiss="closeCalendar()"
      ></Calendar>
    </template>
    <div class="rdp-app__mobile-dock">
      <CalendarActionBar
        position="bottom"
        x-bind:date="focusedDate"
        x-bind:locale="locale"
        x-on:pill-click="openCalendar()"
        x-on:prev="prevDay()"
        x-on:next="nextDay()"
        x-bind:prevDisabled="prevDayDisabled"
        x-bind:nextDisabled="nextDayDisabled"
      ></CalendarActionBar>
    </div>
  </template>
  <style>
    <span x-html="`
            .rdp-app {
              background: var(--color-taupe-grey);
              min-height: 100vh;
              font-family: Roboto, sans-serif;
              color: var(--color-content-text);
            }
            .rdp-app__main-toggle {
              display: flex;
              gap: 0;
              margin: 0 0 var(--separation-2);
              border: 1.5px solid var(--color-brand);
              border-radius: var(--radius-default);
              overflow: hidden;
              width: fit-content;
            }
            .rdp-app__main-toggle-btn {
              appearance: none;
              background: var(--color-white);
              border: 0;
              color: var(--color-brand);
              font-family: inherit;
              font-size: var(--font-size-status-text);
              font-weight: 600;
              padding: 8px 18px;
              cursor: pointer;
              line-height: 1.2;
            }
            .rdp-app__main-toggle-btn--active {
              background: var(--color-brand);
              color: var(--color-white);
            }
            .rdp-app__main-toggle-btn:not(.rdp-app__main-toggle-btn--active):hover {
              background: var(--color-taupe-grey);
            }
            .rdp-app__summary {
              background: var(--color-white);
              border-radius: var(--radius-default);
              padding: var(--separation-2);
              font-size: var(--font-size-content);
              line-height: var(--line-height-base);
            }
            .rdp-app__summary-h1 {
              font-family: Signika, sans-serif;
              font-size: 1.5rem;
              color: var(--color-brand);
              margin: 0 0 var(--separation-2);
            }
            .rdp-app__summary-h2 {
              font-family: Signika, sans-serif;
              font-size: 1.2rem;
              color: var(--color-brand);
              margin: var(--separation-2) 0 var(--separation-1);
            }
            .rdp-app__summary-h3 {
              font-family: Signika, sans-serif;
              font-size: 1.05rem;
              color: var(--color-content-text);
              margin: var(--separation-2) 0 var(--separation-1);
            }
            .rdp-app__summary-p { margin: 0 0 var(--separation-1); }
            .rdp-app__summary-ul { margin: 0 0 var(--separation-1); padding-left: 1.5em; }
            .rdp-app__summary-ul li { margin-bottom: 4px; }
            .rdp-app__summary-handle {
              color: var(--color-brand);
              text-decoration: none;
              border-bottom: 1px solid currentColor;
            }
            /* Keep the colour fixed on hover; only the underline thickens
               subtly to indicate interactivity. */
            .rdp-app__summary-handle:hover,
            .rdp-app__summary-handle:active,
            .rdp-app__summary-handle:focus {
              color: var(--color-brand);
            }
            .rdp-app__summary-handle:hover { border-bottom-width: 2px; }
            .rdp-app__synthesis-title {
              font-family: Signika, sans-serif;
              font-size: 1.6rem;
              color: var(--color-brand);
              margin: 0 0 var(--separation-2);
              line-height: 1.2;
            }
            /* The header ribbon stays full-viewport-wide so the white band
               reaches both edges of the page; only the inner row + the content
               grid honour the legacy max-width. Mobile mirrors the same pattern
               around a tighter phone width. */
            .rdp-app__header-ribbon {
              background: var(--color-white);
              border-bottom: 1px solid var(--color-border);
            }
            .rdp-app__header-inner {
              max-width: 952px;
              margin: 0 auto;
            }
            .rdp-app--mobile .rdp-app__header-inner {
              max-width: 480px;
            }
            /* Drop AppHeader’s own white bg + border so the ribbon’s full-width
               band shows through on both sides of the inner row. */
            .rdp-app__header-ribbon .rdp-app-header {
              background: transparent;
              border-bottom: none;
            }
            /* Mobile: keep the ribbon full-viewport-wide, constrain the post
               list + dock to a phone-sized column instead. */
            .rdp-app--mobile .rdp-app__mobile-main {
              max-width: 480px;
              margin: 0 auto;
            }
            .rdp-app__popular-news {
              margin: 0;
              padding: var(--separation-1) var(--separation-2);
              font-family: Signika, sans-serif;
              font-size: var(--font-size-content);
              color: var(--color-brand);
              background: var(--color-white);
              border-bottom: 1px solid var(--color-border);
              text-align: center;
            }
            .rdp-app__content {
              display: grid;
              grid-template-columns: 1fr;
              gap: var(--separation-2);
              padding: var(--separation-2);
              margin: 0 auto;
              box-sizing: border-box;
            }
            /* Match the legacy combined sidebar (336px) + right column (600px)
               plus a 16px gap = $width-desktop = 952px. The header ribbon stays
               full-viewport-wide; everything below caps here. */
            .rdp-app--desktop .rdp-app__content {
              grid-template-columns: 336px 1fr;
              align-items: start;
              max-width: 952px;
            }
            .rdp-app--desktop .rdp-app__popular-news {
              max-width: 952px;
              margin-left: auto;
              margin-right: auto;
            }
            .rdp-app__main,
            .rdp-app__mobile-main {
              min-width: 0;
              display: flex;
              flex-direction: column;
              gap: var(--separation-2);
            }
            .rdp-app__mobile-main {
              padding: var(--separation-2);
              padding-bottom: calc(64px + var(--separation-2));
            }
            .rdp-app__post-list {
              list-style: none;
              margin: 0;
              padding: 0;
              display: flex;
              flex-direction: column;
              gap: var(--separation-2);
            }
            .rdp-app__post-item { margin: 0; }
            .rdp-app__back {
              align-self: flex-start;
              background: var(--color-white);
              border: 1px solid var(--color-brand);
              border-radius: var(--radius-default);
              color: var(--color-brand);
              padding: var(--separation-1) var(--separation-2);
              font-family: Roboto, sans-serif;
              font-size: var(--font-size-content);
              cursor: pointer;
            }
            .rdp-app__back:hover { background: var(--color-brand); color: var(--color-white); }
            .rdp-app__column {
              min-width: 0;
            }
            .rdp-app--mobile { --rdp-mobile-dock-height: 67px; }
            /* Fixed dock + calendar sheet stay centred at the same max-width as
               the mobile column so a desktop browser previewing the mobile
               variant doesn't show full-viewport bottom UI. */
            .rdp-app__mobile-dock {
              position: fixed;
              left: 50%;
              transform: translateX(-50%);
              width: 100%;
              max-width: 480px;
              bottom: 0;
              height: var(--rdp-mobile-dock-height);
              box-sizing: border-box;
              background: var(--color-white);
              padding: 0 var(--separation-2) 0 0;
              z-index: 20;
              box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
            }
            .rdp-app--mobile .rdp-calendar-action-bar--bottom {
              width: 100%;
              height: 100%;
              margin: 0;
              padding: 0 var(--separation-2) 0 0;
              border-radius: 0;
            }
            .rdp-app--mobile .rdp-calendar--sheet {
              left: 50%;
              right: auto;
              transform: translateX(-50%);
              width: 100%;
              max-width: 480px;
              padding-bottom: var(--rdp-mobile-dock-height);
            }
            .rdp-app--mobile .rdp-calendar__scrim {
              left: 50%;
              right: auto;
              transform: translateX(-50%);
              width: 100%;
              max-width: 480px;
              bottom: var(--rdp-mobile-dock-height);
            }
          `"></span>
  </style>
</div>
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("app", () => ({
      focusedDate: new Date(),
      isCalendarOpen: false,
      currentView: "main",
      initialised: false,
      get popularNewsLine() {
        return t(
          "header.popular-news",
          {
            date: formatLegacyShortDay(
              props.pickedDate,
              props.locale ?? "fr-FR"
            ),
          },
          props.locale ?? "fr-FR"
        );
      },
      get synthesisHeadline() {
        return t(
          "header.synthesis",
          {
            date: formatLegacyShortDay(
              props.pickedDate,
              props.locale ?? "fr-FR"
            ),
          },
          props.locale ?? "fr-FR"
        );
      },
      prevDay() {
        const next = new Date(this.focusedDate);
        next.setDate(next.getDate() - 1);
        this.focusedDate = next;
        this.currentView = "main";
        props.onViewChange?.("main");
        props.onDateSelect?.(next);
      },
      nextDay() {
        const next = new Date(this.focusedDate);
        next.setDate(next.getDate() + 1);
        this.focusedDate = next;
        this.currentView = "main";
        props.onViewChange?.("main");
        props.onDateSelect?.(next);
      },
      openCalendar() {
        this.isCalendarOpen = true;
      },
      closeCalendar() {
        this.isCalendarOpen = false;
      },
      pickFromCalendar(d) {
        this.focusedDate = d;
        this.isCalendarOpen = false;
        this.currentView = "main";
        props.onViewChange?.("main");
        props.onDateSelect?.(d);
      },
      selectFromSidebar(d) {
        this.focusedDate = d;
        this.currentView = "main";
        props.onViewChange?.("main");
        props.onDateSelect?.(d);
      },
      goTo(view) {
        this.currentView = view;
        props.onViewChange?.(view);
      },
      goHome() {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        yesterday.setHours(0, 0, 0, 0);
        this.focusedDate = yesterday;
        this.currentView = "main";
        props.onViewChange?.("main");
        props.onDateSelect?.(yesterday);
        props.onLogoClick?.();
      },
      get prevDayDisabled() {
        if (!props.minDate) return false;
        const cur = new Date(
          this.focusedDate.getFullYear(),
          this.focusedDate.getMonth(),
          this.focusedDate.getDate()
        );
        const min = new Date(
          props.minDate.getFullYear(),
          props.minDate.getMonth(),
          props.minDate.getDate()
        );
        return cur.getTime() <= min.getTime();
      },
      get nextDayDisabled() {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        yesterday.setHours(0, 0, 0, 0);
        const cur = new Date(
          this.focusedDate.getFullYear(),
          this.focusedDate.getMonth(),
          this.focusedDate.getDate()
        );
        return cur.getTime() >= yesterday.getTime();
      },
      init() {
        this.focusedDate = props.pickedDate;
        if (props.initialView) {
          this.currentView = props.initialView;
        }
        this.initialised = true;
      },
    }));
  });
</script>
