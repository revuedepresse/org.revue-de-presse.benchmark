name: linkedin-post

on:
  schedule:
    # TODO: revert to "30 4 * * *" (05:30 Europe/Paris in summer / CEST) after validation.
    # Validation value: 12:55 UTC = 14:55 Europe/Paris on 2026-05-21.
    - cron: '00 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: social/linkedin
    env:
      LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_REDIRECT_URI:  ${{ vars.LINKEDIN_REDIRECT_URI }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      LINKEDIN_ROTATED_REFRESH_TOKEN_FILE: /tmp/rotated-refresh-token.txt
      API_BASE_URL:           ${{ vars.API_BASE_URL }}
      API_CLIENT_SECRET:      ${{ secrets.API_CLIENT_SECRET }}
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: social/linkedin/.nvmrc
          cache: pnpm
          cache-dependency-path: social/linkedin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Post yesterday's top 10
        run: pnpm post

      - name: Rotate LINKEDIN_REFRESH_TOKEN secret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_LINKEDIN_PAT }}
        run: |
          if [ ! -s "$LINKEDIN_ROTATED_REFRESH_TOKEN_FILE" ]; then
            echo "No rotated refresh token written — nothing to update."
            exit 0
          fi
          NEW_TOKEN=$(cat "$LINKEDIN_ROTATED_REFRESH_TOKEN_FILE")
          if [ "$NEW_TOKEN" = "$LINKEDIN_REFRESH_TOKEN" ]; then
            echo "Refresh token unchanged — skipping secret update."
            exit 0
          fi
          echo "LinkedIn rotated the refresh token — updating GitHub secret."
          gh secret set LINKEDIN_REFRESH_TOKEN \
            --body "$NEW_TOKEN" \
            --repo "$GITHUB_REPOSITORY"
