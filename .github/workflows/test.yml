name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: nuxt
            test_script: test:run
          - workspace: design-system
            test_script: test
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version-file: ${{ matrix.workspace }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.test_script }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      NUXT_API_BASE_URL: http://localhost:4000
      NUXT_API_CLIENT_SECRET: mock-client-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            nuxt/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Install nuxt deps
        run: pnpm install --frozen-lockfile
        working-directory: nuxt
      - name: Install e2e deps
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - name: Build Nuxt app
        run: pnpm build
        working-directory: nuxt
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e functional suite
        run: pnpm test:functional
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-functional
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14

  perf:
    name: perf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      NUXT_API_BASE_URL: http://localhost:4000
      NUXT_API_CLIENT_SECRET: mock-client-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            nuxt/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            social/tiktok/pnpm-lock.yaml
      - name: Install nuxt deps
        run: pnpm install --frozen-lockfile
        working-directory: nuxt
      - name: Install e2e deps
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - name: Install tiktok deps
        run: pnpm install --frozen-lockfile
        working-directory: social/tiktok
      - name: Build Nuxt app
        run: pnpm build
        working-directory: nuxt
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: Run e2e perf suite
        run: pnpm test:perf
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-perf
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14

  native-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - run: cd design-system && pnpm install --frozen-lockfile
      - name: design-system codegen tests
        run: cd design-system && pnpm test:scripts
      - name: native codegen compile
        run: cd native && ./gradlew :domain:compileKotlinJvm
      - name: native unit tests (:domain :data :design :ui)
        run: cd native && ./gradlew :domain:allTests :data:allTests :design:allTests :ui:allTests

  native-android-build:
    runs-on: ubuntu-latest
    needs: native-codegen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - run: cd design-system && pnpm install --frozen-lockfile
      - run: cd native && ./gradlew :androidApp:assembleDebug

  native-android-e2e:
    runs-on: ubuntu-latest
    needs: native-android-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - run: cd design-system && pnpm install --frozen-lockfile
      - run: cd e2e            && pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34

      - name: Android emulator + Maestro suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd native && ./gradlew :androidApp:installDebug
            cd e2e && pnpm maestro:android

  native-ios-e2e:
    runs-on: macos-14
    needs: native-ios-build
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - run: cd design-system && pnpm install --frozen-lockfile
      - run: cd e2e            && pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iPhone simulator
        run: |
          xcrun simctl list devices
          xcrun simctl boot "iPhone 15" || true

      - name: Note iOS app installation pending
        run: |
          echo "Real iOS app install requires an Xcode project bootstrapped from native/iosApp/"
          echo "Until that's done, this job verifies Maestro runs on macOS host."
          cd e2e && maestro --version

      # TODO: once iosApp.xcodeproj exists and the XCFramework links, replace the
      # above with actual xcodebuild + xcrun simctl install + pnpm maestro:ios.

  native-ios-build:
    runs-on: macos-14
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - run: cd design-system && pnpm install --frozen-lockfile
      - run: cd native && ./gradlew :iosApp:compileKotlinIosX64

  native-desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - run: cd design-system && pnpm install --frozen-lockfile
      - run: cd native && ./gradlew :desktopApp:compileKotlinJvm
