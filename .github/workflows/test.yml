name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: nuxt
            test_script: test:run
          - workspace: design-system
            test_script: test
            typecheck: true
          - workspace: social/linkedin
            test_script: test:run
            typecheck: true
          - workspace: social/bluesky
            test_script: test:run
            typecheck: true
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v5
      # No `version:` — the pnpm release comes from the workspace's
      # "packageManager" pin, so CI, developer machines and the deploy host all
      # run the same one. Hardcoding 10 here meant CI never exercised pnpm 11's
      # strictDepBuilds or its lockfile supply-chain policies.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.workspace }}/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: ${{ matrix.workspace }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: matrix.typecheck
        run: pnpm typecheck
      - run: pnpm ${{ matrix.test_script }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      NUXT_API_BASE_URL: http://localhost:4000
      NUXT_API_CLIENT_SECRET: mock-client-secret
    steps:
      - uses: actions/checkout@v5
      # Version comes from the workspace "packageManager" pin — see the note in
      # the `test` job above.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            nuxt/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Install nuxt deps
        run: pnpm install --frozen-lockfile
        working-directory: nuxt
      - name: Install e2e deps
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      # Ahead of the build: a type error in the specs is cheaper to surface
      # than after a full Nuxt build and a browser download.
      - name: Typecheck
        run: pnpm typecheck
        working-directory: e2e
      - name: Build Nuxt app
        run: pnpm build
        working-directory: nuxt
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e functional suite
        run: pnpm test:functional
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-functional
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14

  perf:
    name: perf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      NUXT_API_BASE_URL: http://localhost:4000
      NUXT_API_CLIENT_SECRET: mock-client-secret
    steps:
      - uses: actions/checkout@v5
      # Version comes from the workspace "packageManager" pin — see the note in
      # the `test` job above.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            nuxt/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Install nuxt deps
        run: pnpm install --frozen-lockfile
        working-directory: nuxt
      - name: Install e2e deps
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - name: Build Nuxt app
        run: pnpm build
        working-directory: nuxt
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e perf suite
        run: pnpm test:perf
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-perf
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14
