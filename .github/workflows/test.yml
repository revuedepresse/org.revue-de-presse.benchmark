name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: nuxt
            test_script: test:run
          - workspace: design-system
            test_script: test
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.workspace }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.test_script }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      NUXT_API_BASE_URL: http://localhost:4000
      NUXT_API_CLIENT_SECRET: mock-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            nuxt/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Install nuxt deps
        run: pnpm install --frozen-lockfile
        working-directory: nuxt
      - name: Install e2e deps
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - name: Build Nuxt app
        run: pnpm build
        working-directory: nuxt
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e functional suite
        run: pnpm test:functional
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-functional
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14

  perf:
    name: perf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      NUXT_API_BASE_URL: http://localhost:4000
      NUXT_API_CLIENT_SECRET: mock-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            nuxt/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            social/tiktok/pnpm-lock.yaml
      - name: Install nuxt deps
        run: pnpm install --frozen-lockfile
        working-directory: nuxt
      - name: Install e2e deps
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - name: Install tiktok deps
        run: pnpm install --frozen-lockfile
        working-directory: social/tiktok
      - name: Build Nuxt app
        run: pnpm build
        working-directory: nuxt
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: Run e2e perf suite
        run: pnpm test:perf
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-perf
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14
