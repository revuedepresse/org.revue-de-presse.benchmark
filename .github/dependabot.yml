version: 2
updates:
  - package-ecosystem: npm
    directory: /design-system
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /social/linkedin
    schedule:
      interval: weekly
  # Below were missing, so no update PRs ever reached them and their
  # advisories accumulated: at the time of writing nuxt holds 16 open
  # alerts, social/bluesky 9 and e2e 3, out of 66 across the repo.
  - package-ecosystem: npm
    directory: /nuxt
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /social/bluesky
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
